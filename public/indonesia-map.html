<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>html,body,#map{height:100%;margin:0}body{background:#bdd8e0}.leaflet-control-attribution{font:10px/1.5 Arial!important}.leaflet-control-attribution a{color:#344b58}</style></head><body><div id="map" aria-label="Indonesia map with Depok location"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map',{scrollWheelZoom:false,attributionControl:false}).setView([-3,118],3);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(map);L.control.attribution({prefix:false}).addAttribution('© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>').addTo(map);L.marker([-6.4025,106.7942]).addTo(map).bindTooltip('Depok, Indonesia');</script></body></html>
